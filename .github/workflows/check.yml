name: daily check

on:
  schedule:
    - cron: "17 6 * * *"     # 07:17 in Lagos
  push:
    branches: [main]
    paths: ["domains.yml", "certwatch/**", ".github/workflows/check.yml"]
  workflow_dispatch:

permissions:
  contents: write     # commit data/history.json back
  pages: write
  id-token: write
  issues: write       # open / update / close the alert issue

concurrency:
  group: certwatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: check certificates
        id: run
        run: |
          set +e
          python -m certwatch domains.yml -o site --history data/history.json \
            --issue-body issue.md --page-url "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cp data/history.json site/

      - name: save history
        run: |
          git config user.name "certwatch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "history: $(date -u +%F)"
            git push
          fi

      - name: alert issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create certwatch --color B60205 --description "certificate alerts" --force >/dev/null
          open=$(gh issue list --label certwatch --state open --json number --jq '.[0].number')
          if [ -f issue.md ]; then
            # canaries are expected to fail; only alert on real hosts
            if grep -v badssl.com issue.md | grep -q '^- \*\*'; then
              grep -v badssl.com issue.md > issue.real.md
              if [ -n "$open" ]; then gh issue edit "$open" --body-file issue.real.md
              else gh issue create --title "certwatch: certificates need attention" --label certwatch --body-file issue.real.md
              fi
              exit 0
            fi
          fi
          if [ -n "$open" ]; then gh issue close "$open" --comment "All certificates are fine again."; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e . pytest
      - run: pytest -q
